instances:
  master-01:
    box: bento/ubuntu-24.04
    ip: 192.168.56.11
    memory: "3072"
    cpus: 2
    deploy:
      - 'rsync -avz -e "ssh -i ~/.ssh/vagrant_ecdsa" ./zig-out/bin/minim-agent root@$IP:/root/'
      - 'rsync -avz -e "ssh -i ~/.ssh/vagrant_ecdsa" ./examples/ root@$IP:/root/examples/'
    run: '/root/minim-agent --controller 192.168.56.1:8080'

