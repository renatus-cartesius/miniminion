version: '3'

vars:
  INSTANCES_YAML:
    sh: cat testing/instances.yaml
  INSTANCES:
    ref: fromYaml .INSTANCES_YAML
  INSTANCES_NAMES_JSON:
    sh: yq -o=json '.instances | keys' testing/instances.yaml
  INSTANCES_NAMES:
    ref: fromYaml .INSTANCES_NAMES_JSON
  SSHIPTS: '-i ~/.ssh/vagrant_ecdsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

tasks:
  build-builder:
    desc: Build the Docker image
    sources:
      - Dockerfile
    cmds:
      - docker build --build-arg UID=$(id -u) --build-arg GID=$(id -g) -t miniminion-builder .

  build:
    desc: Build the miniminion project
    cmds:
      - docker run --rm -v .:/workspace -w /workspace miniminion-builder zig build -Doptimize=Debug --summary all
    sources:
      - src/**/*.zig
      - src/**/*.c
      - build.zig
    generates:
      - zig-out/bin/minim-agent
      - zig-out/bin/minim-controller
    deps:
      - build-builder

  test:
    desc: Run unit tests
    cmds:
      - docker run --rm -v .:/workspace -w /workspace miniminion-builder zig test src/resource.zig -lc -static --name all-tests
    deps:
      - build-builder

  test-e2e:
    desc: Run stack orchestration e2e tests
    cmds:
      - bash test/e2e_stack.sh
    deps:
      - build

  v-status:
    desc: 'Get status for vagrant instances'
    dir: './testing'
    cmd: 'vagrant status'

  v-up:*:
    vars:
      T: "{{ index .MATCH 0 }}"
      TARGETS: '{{if eq .T "all"}}{{.INSTANCES_NAMES | toJson}}{{else}}["{{.T}}"]{{end}}'
    desc: 'Up {{index .MATCH 0}} vagrant vm'
    dir: './testing'
    cmd: |
      {{range $index, $element := .TARGETS | fromJson}}
      vagrant up {{ $element }} --provision &
      {{end}}
      wait

  v-destroy:*:
    vars:
      T: "{{ index .MATCH 0 }}"
      TARGETS: '{{if eq .T "all"}}{{.INSTANCES_NAMES | toJson}}{{else}}["{{.T}}"]{{end}}'
    desc: 'Destroy {{index .MATCH 0}} vagrant vm'
    dir: './testing'
    cmd: |
      {{range $index, $element := .TARGETS | fromJson}}
      vagrant destroy -f {{ $element }} &
      {{end}}
      wait

  v-login:*:
    desc: 'Login into {{index .MATCH 0}} vagrant vm'
    vars:
      VM_IP: '{{index .INSTANCES.instances (index .MATCH 0) "ip"}}'
    cmd: 'ssh root@{{.VM_IP}} {{.SSHIPTS}}'

  v-deploy:*:
    vars:
      T: "{{ index .MATCH 0 }}"
      TARGETS: '{{if eq .T "all"}}{{.INSTANCES_NAMES | toJson}}{{else}}["{{.T}}"]{{end}}'
    desc: 'Deploy to {{index .MATCH 0}} VM'
    cmds:
      - cmd: |
          {{range $index, $element := .TARGETS | fromJson}}
          IP={{index $.INSTANCES.instances $element "ip"}} NAME={{$element}}
          {{range (index $.INSTANCES.instances $element "deploy")}}
          {{.}} &
          {{end}}
          {{end}}
          wait
    failfast: true
    deps:
      - build

  v-cluster:
    desc: 'Bootstrap the full K8s cluster (masters then workers)'
    cmds:
      - task: v-redeploy:controller-01
      - task: v-redeploy:master-01
      - task: v-redeploy:master-02
      - task: v-redeploy:master-03
      - task: v-redeploy:worker-01
      - task: v-redeploy:worker-02
      - task: v-redeploy:worker-03
    deps:
      - build

  v-bootstrap:*:
    vars:
      T: "{{ index .MATCH 0 }}"
      TARGETS: '{{if eq .T "all"}}{{.INSTANCES_NAMES | toJson}}{{else}}["{{.T}}"]{{end}}'
    desc: 'Bootstrap {{index .MATCH 0}} VM (setup dependencies)'
    cmds:
      - cmd: |
          {{range $index, $element := .TARGETS | fromJson}}
          {{$bootstrap := index $.INSTANCES.instances $element "bootstrap"}}
          {{if $bootstrap}}
          IP={{index $.INSTANCES.instances $element "ip"}} NAME={{$element}}
          echo "Bootstrapping $NAME..."
          ssh root@$IP {{$.SSHIPTS}} 'bash -s' <<'BOOTSTRAP_SCRIPT' &
          {{range $bootstrap}}
          {{.}}
          {{end}}
          BOOTSTRAP_SCRIPT
          {{end}}
          {{end}}
          wait

  v-redeploy:*:
    vars:
      T: "{{ index .MATCH 0 }}"
    desc: 'Recreate {{index .MATCH 0}} and deploy files'
    dir: './testing'
    cmds:
      - task: "v-destroy:{{ .T }}"
      - task: "v-up:{{ .T }}"
      - task: "v-bootstrap:{{ .T }}"
      - task: "v-deploy:{{ .T }}"
      - task: "v-run:{{ .T }}"
    deps:
      - build

  v-cmd:*:
    vars:
      T: "{{ index .MATCH 0 }}"
      TARGETS: '{{if eq .T "all"}}{{.INSTANCES_NAMES | toJson}}{{else}}{{.T | splitList "," | toJson}}{{end}}'
    desc: 'Run arbitrary command on VMs (e.g. task v-cmd:all -- hostnamectl)'
    cmds:
      - cmd: |
          TMPDIR=$(mktemp -d)
          {{range $index, $element := .TARGETS | fromJson}}
          IP={{index $.INSTANCES.instances $element "ip"}} NAME={{$element}}
          ( ssh root@$IP {{$.SSHIPTS}} "{{$.CLI_ARGS}}" >"$TMPDIR/$NAME.out" 2>"$TMPDIR/$NAME.err" ) &
          {{end}}
          wait
          for f in "$TMPDIR"/*.out; do
            name=$(basename "$f" .out)
            echo "========== $name =========="
            cat "$f"
            if [ -s "$TMPDIR/$name.err" ]; then
              echo "-- stderr --"
              cat "$TMPDIR/$name.err"
            fi
            echo
          done
          rm -rf "$TMPDIR"
        silent: true

  v-run:*:
    vars:
      T: "{{ index .MATCH 0 }}"
      TARGETS: '{{if eq .T "all"}}{{.INSTANCES_NAMES | toJson}}{{else}}["{{.T}}"]{{end}}'
    desc: 'Run on {{index .MATCH 0}} VM'
    cmds:
      - cmd: |
          {{range $index, $element := .TARGETS | fromJson}}
          IP={{index $.INSTANCES.instances $element "ip"}} NAME={{$element}}
          CMD="systemctl stop minim-agent 2>/dev/null; systemctl reset-failed minim-agent 2>/dev/null; systemd-run --unit=minim-agent --description='minim-agent service' --same-dir --collect --property=Type=simple --property=Restart=on-failure sh -c '{{index $.INSTANCES.instances $element "run"}}'"
          ssh root@$IP {{$.SSHIPTS}} "$CMD" &
          {{end}}
          wait
