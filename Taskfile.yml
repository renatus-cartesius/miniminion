version: '3'

tasks:
  build-builder:
    desc: Build the Docker image
    sources:
      - Dockerfile
    cmds:
      - docker build --build-arg UID=$(id -u) --build-arg GID=$(id -g) -t miniminion-builder .

  build:
    desc: Build the miniminion project inside Zig container
    cmds:
      - docker run --rm -v .:/workspace -w /workspace miniminion-builder zig build -Doptimize=Debug --summary all
    sources:
      - src/**/*.zig
      - src/**/*.c
      - build.zig
    generates:
      - zig-out/bin/miniminion
    deps:
      - build-builder

  v-up:
    desc: Up vagrant vm
    dir: './testing/'
    cmd: vagrant up

  v-deploy:
    desc: Deploy miniminion binary and config to Vagrant VM
    cmds:
      - rsync -avz -e "ssh -i ~/.ssh/vagrant_ecdsa" ./zig-out/bin/miniminion root@192.168.56.2:/root/
      - rsync -avz -e "ssh -i ~/.ssh/vagrant_ecdsa" ./minim.jsonnet root@192.168.56.2:/root/
      - task: v-examples-copy
      # - task: v-run
    failfast: true
    deps:
      - build
      # - v-up

  v-examples-copy:
    desc: Copy examples directory to Vagrant VM
    cmds:
      - rsync -avz -e "ssh -i ~/.ssh/vagrant_ecdsa" ./examples/ root@192.168.56.2:/root/examples/
  
  v-redeploy:
    desc: Recreate vm and deploy files
    dir: './testing'
    cmds:
      - task: v-destroy
      - task: v-up
      - task: v-deploy

  v-ssh:
    desc: Login into vagrant vm
    cmd: ssh root@192.168.56.2 -i ~/.ssh/vagrant_ecdsa
    # deps:
    #   - v-up

  v-run:
    desc: Run minim from vagrant vm
    cmds:
      - "ssh root@192.168.56.2 -i ~/.ssh/vagrant_ecdsa -- rm -rf /sys/fs/bpf/*"
      - "ssh root@192.168.56.2 -i ~/.ssh/vagrant_ecdsa -- /root/miniminion"

  v-run-trace:
    desc: Run minim from vagrant vm with bpf tracelog
    cmds:
      - task: v-run
      - "ssh root@192.168.56.2 -i ~/.ssh/vagrant_ecdsa -- killall bpftool || true"
      - "ssh root@192.168.56.2 -i ~/.ssh/vagrant_ecdsa -- bpftool prog tracelog"

  v-destroy:
    desg: Destroy vagrant vm
    dir: './testing/'
    cmd: vagrant destroy -f

