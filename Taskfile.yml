version: '3'

vars:
  INSTANCES_YAML:
    sh: cat testing/instances.yaml
  INSTANCES:
    ref: fromYaml .INSTANCES_YAML
  INSTANCES_NAMES:
    sh: yq '.instances | keys | .[]' testing/instances.yaml
  SSHIPTS: '-i ~/.ssh/vagrant_ecdsa'

tasks:
  build-builder:
    desc: Build the Docker image
    sources:
      - Dockerfile
    cmds:
      - docker build --build-arg UID=$(id -u) --build-arg GID=$(id -g) -t miniminion-builder .

  build:
    desc: Build the miniminion project
    cmds:
      - docker run --rm -v .:/workspace -w /workspace miniminion-builder zig build -Doptimize=Debug --summary all
    sources:
      - src/**/*.zig
      - src/**/*.c
      - build.zig
    generates:
      - zig-out/bin/miniminion
    deps:
      - build-builder

  test:
    desc: Run all tests
    cmds:
      - docker run --rm -v .:/workspace -w /workspace miniminion-builder zig test src/resource.zig -lc -static --name all-tests
    deps:
      - build-builder

  v-up:*:
    desc: 'Up {{index .MATCH 0}} vagrant vm'
    dir: './testing'
    cmd: 'vagrant up {{index .MATCH 0}}'

  v-destroy:*:
    desc: 'Destroy {{index .MATCH 0}} vagrant vm'
    dir: './testing'
    cmd: 'vagrant destroy -f {{index .MATCH 0}}'

  v-ssh:*:
    desc: 'Login into {{index .MATCH 0}} vagrant vm'
    vars:
      VM_IP: '{{index .INSTANCES.instances (index .MATCH 0) "ip"}}'
    cmd: 'ssh root@{{.VM_IP}} {{.SSHIPTS}}'

  v-deploy:*:
    desc: 'Deploy miniminion to {{index .MATCH 0}} VM'
    vars:
      VM_IP: '{{index .INSTANCES.instances (index .MATCH 0) "ip"}}'
    cmds:
      - 'rsync -avz -e "ssh {{.SSHIPTS}}" ./zig-out/bin/miniminion root@{{.VM_IP}}:/root/'
      - 'rsync -avz -e "ssh {{.SSHIPTS}}" ./minim.jsonnet root@{{.VM_IP}}:/root/'
    failfast: true
    deps:
      - build

  v-redeploy:*:
    desc: 'Recreate {{index .MATCH 0}} vm and deploy files'
    dir: './testing'
    cmds:
      - task: v-destroy:{{index .MATCH 0}}
      - task: v-up:{{index .MATCH 0}}
      - task: v-deploy:{{index .MATCH 0}}

  v-run:*:
    desc: 'Run minim on {{index .MATCH 0}} vagrant vm'
    vars:
      VM_IP: '{{index .INSTANCES.instances (index .MATCH 0) "ip"}}'
    cmds:
      - 'ssh root@{{.VM_IP}} {{.SSHIPTS}} -- rm -rf /sys/fs/bpf/* 2>/dev/null; true'
      - 'ssh root@{{.VM_IP}} {{.SSHIPTS}} -- /root/miniminion'

  v-run-trace:
    desc: Run minim from ubuntu vagrant vm with bpf tracelog
    vars:
      VM_IP: '{{index .INSTANCES.instances "ubuntu" "ip"}}'
    cmds:
      - task: v-run:ubuntu
      - 'ssh root@{{.VM_IP}} {{.SSHIPTS}} -- killall bpftool || true'
      - 'ssh root@{{.VM_IP}} {{.SSHIPTS}} -- bpftool prog tracelog'

  v-examples-copy:
    desc: Copy examples directory to all Vagrant VMs
    cmds:
      - for: { var: INSTANCES_NAMES, parallel: true }
        cmd: 'rsync -avz -e "ssh {{$.SSHIPTS}}" ./examples/ root@{{index $.INSTANCES.instances .ITEM "ip"}}:/root/examples/'
